server {
    listen 80;
    listen [::]:80;
    server_name tesla.dtconcepts.net ssh.dtconcepts.net;
    location ^~ /.well-known/acme-challenge/ { root /var/www/tesla/acme; }
    location / { return 301 https://tesla.dtconcepts.net$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tesla.dtconcepts.net;
    ssl_certificate /etc/letsencrypt/live/tesla-link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tesla-link/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 1m;
    access_log off; # Avoid retaining OAuth codes and location query parameters.
    error_log /var/log/nginx/tesla-error.log warn;

    location = /configure {
        limit_except POST { deny all; }
        proxy_pass https://127.0.0.1:8443/configure;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_server_name on;
        proxy_ssl_name ssh.dtconcepts.net;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 40s;
    }
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
